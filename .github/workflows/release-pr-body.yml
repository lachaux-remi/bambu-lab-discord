name: Validate Release Please pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate-body:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Validate machine-generated release data
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Eq '^chore\([^)]+\): release [0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' <<< "$PR_TITLE"; then
            echo "Release pull request title must keep the conventional English Release Please format."
            exit 1
          fi

          mapfile -t separators < <(grep -n '^---$' <<< "$PR_BODY" | cut -d: -f1)
          if [[ "${#separators[@]}" -ne 2 ]]; then
            echo "Release pull request body must keep both exact --- separator lines."
            exit 1
          fi

          machine_block="$(sed -n "$((separators[0] + 1)),$((separators[1] - 1))p" <<< "$PR_BODY")"
          if ! grep -Eq '^##+ \[?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?\]?' <<< "$machine_block"; then
            echo "Release pull request body no longer contains the generated version heading."
            exit 1
          fi
